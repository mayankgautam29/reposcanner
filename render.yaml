services:
  - type: web
    name: reposcanner-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMALL_MODEL
        value: gemini-3.5-flash-lite
      - key: STRONG_MODEL
        value: gemini-3.8-flash
      - key: VALIDATOR_MODEL
        value: gemini-3.6-flash
